# Configuración base (design D6). Todo secreto llega por variables de entorno, sin valores por defecto.
spring:
  application:
    name: sistema-odontologico
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
    locations: classpath:db/migration
    # Rol de la aplicación, para los REVOKE de las migraciones (C-02, design D7)
    placeholders:
      app-user: ${DB_APP_USER}
  mvc:
    async:
      # Tope de la descarga de la exportación (C-19, design Risks)
      request-timeout: 5m
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Envío de emails de recuperación (C-05, design D5). En local, Mailpit; credenciales vacías.
  mail:
    host: ${SMTP_HOST:mailpit}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  # Una caída del SMTP no deja al backend "DOWN": la recuperación responde 202 igual (C-05, design D4).
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

# Autenticación (C-04). Los secretos llegan por variables de entorno, sin valores por defecto.
app:
  auth:
    jwt-secreto: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P14D}
    frontend-origin: ${APP_FRONTEND_ORIGIN:}
    terminos-version-vigente: ${TERMINOS_VERSION_VIGENTE:2026-11-borrador}
  # Versión de docs/legal/politica-de-privacidad.md que acepta quien reserva por el link (C-15, design D7).
  privacidad:
    version-vigente: ${PRIVACIDAD_VERSION_VIGENTE:2026-11-borrador}
  mail:
    from: ${MAIL_FROM:no-responder@localhost}
  # Límites de solicitudes de autenticación (C-05, design D8). Se ajustan sin cambiar el código.
  rate-limit:
    login: { capacidad: 10, periodo: 1m }
    registro: { capacidad: 5, periodo: 1h }
    refresh: { capacidad: 30, periodo: 1m }
    recuperacion: { capacidad: 5, periodo: 1h }
    recuperacion-por-email: { capacidad: 3, periodo: 1h }
    confirmar-recuperacion: { capacidad: 10, periodo: 1h }
    cambiar-password: { capacidad: 5, periodo: 15m }
  # Límites de la API pública (C-15, design D9): por IP (reserva y consulta) y por token (modificaciones).
  rate-limit-publico:
    reserva: { capacidad: 10, periodo: 1h }
    consulta: { capacidad: 60, periodo: 1m }
    token: { capacidad: 10, periodo: 1h }
  # Tarea diaria que pasa a VENCIDO las pruebas terminadas (C-20, FL-07, design D2). "-" la desactiva.
  plan:
    vencimiento:
      cron: ${PLAN_VENCIMIENTO_CRON:0 0 3 * * *}

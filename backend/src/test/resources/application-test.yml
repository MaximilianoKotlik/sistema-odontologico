# Perfil de tests: la base la provee Testcontainers (IntegracionPostgresTest).

# Límites bajos para que los tests de rate limit los alcancen rápido (C-05, design D8). Los períodos quedan
# como en producción: los tests avanzan el Clock.
app:
  rate-limit:
    login: { capacidad: 3, periodo: 1m }
    registro: { capacidad: 3, periodo: 1h }
    refresh: { capacidad: 3, periodo: 1m }
    recuperacion: { capacidad: 3, periodo: 1h }
    recuperacion-por-email: { capacidad: 2, periodo: 1h }
    confirmar-recuperacion: { capacidad: 3, periodo: 1h }
    cambiar-password: { capacidad: 3, periodo: 15m }

logging:
  level:
    org.testcontainers: WARN

# Perfil de tests: la base la provee Testcontainers (IntegracionPostgresTest).

# Cada configuración de test distinta levanta su propio contexto de Spring (y su pool) contra el mismo PostgreSQL:
# un pool chico evita agotar max_connections cuando la suite tiene varios contextos en caché.
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

# Límites de solicitudes (C-05, design D8). Toda la suite comparte un limitador y la IP 127.0.0.1, así que los
# límites por IP son altos para no interferir con los demás tests; los de rate limit usan su propio contexto con
# límites bajos. Los límites por email y por usuario quedan bajos: cada test usa cuentas propias.
app:
  rate-limit:
    login: { capacidad: 10000, periodo: 1m }
    registro: { capacidad: 10000, periodo: 1h }
    refresh: { capacidad: 10000, periodo: 1m }
    recuperacion: { capacidad: 10000, periodo: 1h }
    recuperacion-por-email: { capacidad: 2, periodo: 1h }
    confirmar-recuperacion: { capacidad: 10000, periodo: 1h }
    cambiar-password: { capacidad: 3, periodo: 15m }
  # API pública (C-15): altos por la misma razón; LimitesPublicosTest usa su propio contexto con límites bajos.
  rate-limit-publico:
    reserva: { capacidad: 100000, periodo: 1h }
    consulta: { capacidad: 100000, periodo: 1m }
    token: { capacidad: 100000, periodo: 1h }

  # Tarea diaria de vencimiento (C-20, design D2): desactivada; los tests llaman a VencerPruebas con el RelojDePrueba.
  plan:
    vencimiento:
      cron: "-"

logging:
  level:
    org.testcontainers: WARN

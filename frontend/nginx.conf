server {
    listen 80;
    root /usr/share/nginx/html;

    # Páginas del paciente (C-16, design D7): el token de /t/{token} viaja en la ruta, así que el navegador no
    # tiene que mandarlo en el Referer. try_files sirve index.html dentro de esta location: si /index.html fuera el
    # último parámetro, nginx haría un redirect interno a "location /" y se perdería la cabecera.
    location ~ ^/(c|t)/ {
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # SPA: toda ruta desconocida vuelve a index.html (el router del cliente la resuelve).
    location / {
        try_files $uri /index.html;
    }
}

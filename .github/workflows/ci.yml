# Integración continua (spec plataforma/integracion-continua, design D7).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, ArchUnit, integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build y tests (Testcontainers usa el Docker del runner)
        run: ./gradlew build --no-daemon
      - name: Publicar contrato OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/build/openapi/openapi.json
          if-no-files-found: error
      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: backend/build/reports/tests/

  frontend:
    name: Frontend (typecheck, lint, tests, build, api-types)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Descargar contrato OpenAPI
        uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/.openapi
      - name: Verificar que api-types.ts coincide con el contrato
        run: |
          npm run api:types -- .openapi/openapi.json
          if ! git diff --exit-code -- src/shared/api-types.ts; then
            echo "::error file=frontend/src/shared/api-types.ts::api-types.ts no coincide con el contrato del backend. Ejecutá npm run api:types y commiteá el resultado."
            exit 1
          fi

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir las imágenes de Compose
        run: |
          cp .env.example .env
          docker compose build

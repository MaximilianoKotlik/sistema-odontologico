# Integración continua (spec plataforma/integracion-continua, design D7).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, ArchUnit, integración)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build y tests (Testcontainers usa el Docker del runner)
        run: ./gradlew build --no-daemon
      - name: Publicar contrato OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/build/openapi/openapi.json
          if-no-files-found: error
      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: backend/build/reports/tests/

  frontend:
    name: Frontend (typecheck, lint, tests, build, api-types)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Descargar contrato OpenAPI
        uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/.openapi
      - name: Verificar que api-types.ts coincide con el contrato
        run: |
          npm run api:types -- .openapi/openapi.json
          if ! git diff --exit-code -- src/shared/api-types.ts; then
            echo "::error file=frontend/src/shared/api-types.ts::api-types.ts no coincide con el contrato del backend. Ejecutá npm run api:types y commiteá el resultado."
            exit 1
          fi

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir las imágenes de Compose
        run: |
          cp .env.example .env
          docker compose build

  # Humo E2E (C-23, design D3): el stack de Compose con el seed de demo y los recorridos críticos en Chromium.
  e2e:
    name: E2E (humo)
    # Fijo: Playwright 1.56 no trae Chromium para ubuntu-latest (26.04). Se actualiza junto con @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Levantar el stack con el seed de demo
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Esperar /actuator/health
        run: |
          for intento in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then exit 0; fi
            sleep 5
          done
          echo "::error::El backend no respondió UP en /actuator/health"
          exit 1
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Correr el humo
        run: npm run humo
      - name: Publicar reporte, capturas, video y traza
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: humo-e2e
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Logs del stack
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 300
      - name: Bajar el stack
        if: always()
        working-directory: .
        run: docker compose down -v
